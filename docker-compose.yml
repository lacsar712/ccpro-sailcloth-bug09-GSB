services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
    ports:
      - "6710:5432"
    volumes:
      - sailcloth_4310_9310_6710_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailcloth -d sailcloth"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: sailcloth-dev-secret-key-change-me
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sailcloth
      POSTGRES_USER: sailcloth
      POSTGRES_PASSWORD: sailcloth
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:4310,http://127.0.0.1:4310"
    ports:
      - "9310:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "4310:80"
    depends_on:
      - backend

volumes:
  sailcloth_4310_9310_6710_pg: